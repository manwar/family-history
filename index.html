<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family History Tree</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <!-- Single unified header -->
  <header>
    <h1>Family History Tree</h1>
    <p>Use pinch/scroll to zoom and drag to navigate</p>
    <div class="search-box">
      <input type="text" id="node-search" placeholder="Search family member..." autocomplete="off">
      <ul id="search-results" class="search-results hidden"></ul>
    </div>
    <div class="export-controls" style="margin-top: 10px;">
      <button id="export-png" class="btn-export">Export PNG</button>
      <button id="export-svg" class="btn-export">Export SVG</button>
    </div>
  </header>

  <!-- Main tree container -->
  <main id="tree-container">
    <!-- Floating zoom controls -->
    <div class="zoom-controls">
      <button id="zoom-in" title="Zoom In">+</button>
      <button id="zoom-out" title="Zoom Out">−</button>
      <button id="zoom-reset" title="Reset View">⟲</button>
    </div>
  </main>

  <!-- Slide-out Details Drawer -->
  <aside id="detail-drawer" class="drawer hidden">
    <button id="close-drawer" class="close-btn">&times;</button>
    <div class="drawer-content">
      <img id="drawer-photo" src="" alt="Profile Photo">
      <h2 id="drawer-name"></h2>
      <p id="drawer-dates" class="meta"></p>
      <hr>
      <p id="drawer-bio">Select a family member to view their biography and records.</p>
    </div>
  </aside>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.error('Service Worker Registration Failed:', err));
    }
  </script>
</body>
</html>
